<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecom</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <nav>
            <h1>Logo</h1>
            <button id="create">Create product</button>
        </nav>
        <div class="products">
            <div class="products_card">
                <div class="img"> <img
                        src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                        alt="Image couldnt loaded"></div>
                <div class="text">
                    <h3>Name</h3>
                    <p>description</p>
                    <p>Price</p>
                </div>
                <div class="btns">
                    <button id="update">Update</button>
                    <button id="delete">Delete</button>
                </div>
            </div>
        </div>
       
        <div class="form">
        <div class="top">
            <div></div>
                <h1 id="cross_button">✖</h1>
            </div>
            <form>

                <h1>Create Product</h1>
                <input type="text" placeholder="Product Name">
                <input type="text" placeholder="Description">
                <input type="number" placeholder="Product Price">
                <input type="url" placeholder="Product Image URL">
                <button>Create</button>
            </form>
        </div>
    </main>



    <script src="script.js"> </script>
</body>

</html>
